services:
  - type: web
    name: minyflow-api
    runtime: node
    plan: free
    rootDir: packages/backend
    buildCommand: npm install && npx prisma generate && npx tsc -p tsconfig.build.json
    startCommand: npx prisma db push --skip-generate && node dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: minyflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false
  - type: pgsql
    name: minyflow-db
    plan: free
    databaseName: minyflow
