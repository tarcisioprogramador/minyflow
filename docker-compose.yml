version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: minyflow-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: minyflow
      POSTGRES_PASSWORD: minyflow_secret
      POSTGRES_DB: minyflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: minyflow-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: minyflow-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://minyflow:minyflow_secret@postgres:5432/minyflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-this-in-production
      PORT: 3001
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
