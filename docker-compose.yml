version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: minyflow-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: minyflow
      POSTGRES_PASSWORD: minyflow_secret
      POSTGRES_DB: minyflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: minyflow-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://minyflow:minyflow_secret@postgres:5432/minyflow
      JWT_SECRET: minyflow-jwt-secret-change-in-production
      JWT_EXPIRATION: 7d
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - postgres

volumes:
  postgres_data:
